[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = ""
authors = [{ name="{{ cookiecutter.authors or 'Sergey-Gureev' }}", email="{{ cookiecutter.user_email or 'sergey.gureev0205@gmail.com' }}" }]


readme = "README.md"
requires-python = ">=3.10,<4.0"
packages = []


[tool.poetry.dependencies]
    python = ">=3.10,<4.0"
    # API clients
    aiohttp = ">=3.9.0"
    aiohttp-retry = ">=2.9.0"
    pydantic = ">=2.0.0"
    httpx = ">=0.27.0"
    # Testing
    pytest = ">=8.0.0"
    pytest-asyncio = ">=1.0.0,<2.0.0"
    allure-pytest = ">=2.13.0"
    assertpy = ">=1.1"
    faker = ">=24.0.0"
    curlify2 = ">=2.0.0,<3.0.0"
    # Swagger coverage
    swagger-coverage-py = ">=2.1.0"
    # Config & utils
    vyper-config = ">=1.2.0"
    structlog = ">=24.0.0"
    python-dotenv = ">=1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = """
    --alluredir=./allure-results
"""
#    --telegram-notifier
#    --telegram-notifier-config-file=../telegram-notifier-config.ini

[tool.poetry.group.lint.dependencies]
ruff = "^0.12.2"
mypy = "^1.16.1"